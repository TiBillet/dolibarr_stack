# DEV SEULEMENT — chantier 06 (module TiBillet). Lu tout seul par `docker compose`.
# Hors de git (.gitignore) : il ne doit jamais arriver sur un serveur.
# 1. Le module en cours d'ecriture est monte comme custom/tibillet.
# 2. lespass.tibillet.localhost pointe vers l'hote (Traefik ecoute sur 443) :
#    les conteneurs Dolibarr peuvent appeler l'API TiBillet de dev.
# / DEV ONLY: mounts the TiBillet module and lets the containers reach the dev API.
services:
  dolibarr:
    volumes:
      - /home/jonas/TiBillet/dev/tibillet-dolibarr:/var/www/html/custom/tibillet
    extra_hosts:
      - "lespass.tibillet.localhost:host-gateway"
  dolibarr-cron:
    volumes:
      - /home/jonas/TiBillet/dev/tibillet-dolibarr:/var/www/html/custom/tibillet
    extra_hosts:
      - "lespass.tibillet.localhost:host-gateway"
